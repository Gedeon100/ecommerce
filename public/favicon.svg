<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="flag-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#008751"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="flag-yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fcd116"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="flag-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8112d"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Benin Flag Ribbon Accent on top right -->
  <g transform="translate(320, 48)">
    <rect x="0" y="0" width="40" height="28" rx="4" fill="url(#flag-green)"/>
    <rect x="42" y="0" width="70" height="13" rx="3" fill="url(#flag-yellow)"/>
    <rect x="42" y="15" width="70" height="13" rx="3" fill="url(#flag-red)"/>
  </g>

  <!-- Main Shopping Bag Icon Graphic -->
  <g filter="url(#shadow)" transform="translate(106, 110)">
    <!-- Bag Handle -->
    <path d="M 85 110 C 85 35, 215 35, 215 110" fill="none" stroke="url(#primary)" stroke-width="26" stroke-linecap="round"/>
    
    <!-- Bag Body -->
    <path d="M 40 110 L 260 110 L 285 300 C 285 316, 272 328, 255 328 L 45 328 C 28 328, 15 316, 15 300 Z" fill="url(#primary)"/>
    
    <!-- Bag Front Detail: Stylized "B" for BéninMarket -->
    <path d="M 120 160 L 160 160 C 180 160, 192 170, 192 185 C 192 198, 182 206, 168 209 C 186 213, 198 223, 198 240 C 198 258, 182 270, 158 270 L 120 270 Z" fill="#0f172a" fill-opacity="0.92"/>
    <path d="M 142 178 L 142 202 L 158 202 C 166 202, 172 197, 172 190 C 172 183, 166 178, 158 178 Z" fill="url(#primary)"/>
    <path d="M 142 224 L 142 252 L 162 252 C 171 252, 177 246, 177 238 C 177 230, 171 224, 162 224 Z" fill="url(#primary)"/>

    <!-- Cash on Delivery tag -->
    <g transform="translate(180, 240)">
      <circle cx="50" cy="50" r="32" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
      <text x="50" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">COD</text>
    </g>
  </g>

  <!-- BéninMarket Text at bottom -->
  <text x="256" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="1.5" text-anchor="middle">
    BÉNIN<tspan fill="#f59e0b">MARKET</tspan>
  </text>
</svg>